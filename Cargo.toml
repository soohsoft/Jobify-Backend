[package]
name = "jobify-backend"
version = "0.1.0"
edition = "2024"
description = "Core jobs-board API for Jobify: auth, jobs, matching, alerts, notifications, scraper ingest"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "query"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
thiserror = "2"
# Outbound email for signup / reset codes. rustls + webpki-roots keeps the binary off
# OpenSSL; `builder`/`smtp-transport`/`tokio1` are the minimum for an async SMTP send.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "ring", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"] }
# Hand-rolled JSON call to the LLM provider — deliberately no OpenAI/async-openai SDK.
# rustls + webpki-roots keeps the binary off OpenSSL; `json` is the only feature needed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
strip = true
lto = true
opt-level = 3
